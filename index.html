
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>建安三高校园圈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
      body { font-family: 'Noto Sans SC', sans-serif; -webkit-tap-highlight-color: transparent; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .pink-gradient { background: linear-gradient(135deg, #FF2E93 0%, #FF75C3 100%); }
      
      /* 精美手账信纸样式 */
      .handbook-paper {
        background-color: #fffef9; /* 奶油暖色纸张 */
        background-image: 
          /* 左侧红色边缘线 */
          linear-gradient(90deg, transparent 39px, #ffccd5 39px, #ffccd5 40px, transparent 40px),
          /* 横向信纸线 */
          linear-gradient(#f0f0f0 1px, transparent 1px);
        background-size: 100% 100%, 100% 32px;
        line-height: 32px;
      }
      
      .masonry-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
      }
    }
    </script>
</head>
<body class="bg-[#FFF9FB] text-gray-900 overflow-x-hidden">
    <div id="root"></div>
</body>
</html>
